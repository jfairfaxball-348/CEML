# Bounded mathematics/source audits only; not a Collatz frontier verifier.
# No owner hardware, secrets, production binaries or scientific intervals.
# Runs stdlib and two C++ compilers on standard free public-repository CPU runners.
name: CEML bounded research certificates

on:
  pull_request:
    paths:
      - ".github/workflows/research-certificates.yml"
      - "research/r3e21_36_sparse_parity_mitm.py"
      - "research/r3e21_37_audit.py"
      - "research/r3e21_37_bitmap_audit.cpp"
      - "research/r3e21_38_authentic_mod3.py"
      - "research/r3e21_38_two_parity_bitmap.cpp"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-certificates.yml"
      - "research/r3e21_36_sparse_parity_mitm.py"
      - "research/r3e21_37_audit.py"
      - "research/r3e21_37_bitmap_audit.cpp"
      - "research/r3e21_38_authentic_mod3.py"
      - "research/r3e21_38_two_parity_bitmap.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-and-bounds:
    name: Exact R36 parity MITM and R37 bounded oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reproduce complete finite R36 certificate (not frontier science)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_36_sparse_parity_mitm.py | tee "$RUNNER_TEMP/r36.txt"
          grep -Fqx 'R36_MITM_PASS cylinders=14958711636 third_block_unsafe_sparse_cylinders=0' "$RUNNER_TEMP/r36.txt"
      - name: R37 exact rational bounds, miniature oracles, base and omission model
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_37_audit.py | tee "$RUNNER_TEMP/r37.txt"
          grep -Fqx 'R37_BOUNDED_AUDIT_PASS' "$RUNNER_TEMP/r37.txt"

  bitmap-24:
    name: Exact R37 2^24 bitmap / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile independently with ${{ matrix.compiler }}
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" -O3 -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/r37_bitmap" research/r3e21_37_bitmap_audit.cpp
      - name: Reproduce all 16,777,216 source bitvector residues (not full source proof)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/r37_bitmap" | tee "$RUNNER_TEMP/r37_bitmap.txt"
          grep -Fqx 'R37_BITMAP_PASS all_residues=16777216 equal_scores=16633847' "$RUNNER_TEMP/r37_bitmap.txt"

  r38-mod3-witness:
    name: R38 authentic mod3 witness and complete two-parity bitmap / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Independent exact original-start witness and base n<=99781
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_38_authentic_mod3.py | tee "$RUNNER_TEMP/r38_witness.txt"
          grep -Fq 'R38_AUTHENTIC_MISMATCH_PASS original_n=2736476243348084729115' "$RUNNER_TEMP/r38_witness.txt"
          grep -Fqx 'R38_BOUNDED_BASE_PASS starts=99781 max_steps=221 max_peak=785412368' "$RUNNER_TEMP/r38_witness.txt"
      - name: Exact all 2^24 residues with incoming even-run parity 0 and 1
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" -O3 -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/r38_parity" research/r3e21_38_two_parity_bitmap.cpp
          "$RUNNER_TEMP/r38_parity" | tee "$RUNNER_TEMP/r38_parity.txt"
          grep -Fqx 'R38_TWO_PARITY_SCAN_COMPLETE residues=16777216 mismatched_scores=399426 source_false_clear_pairs=63015 source_false_keep_pairs=11401' "$RUNNER_TEMP/r38_parity.txt"
