# Bounded mathematics/source audits only; not a Collatz frontier verifier.
# No owner hardware, secrets, production binaries or scientific intervals.
# Runs stdlib and two C++ compilers on standard free public-repository CPU runners.
name: CEML bounded research certificates

on:
  pull_request:
    paths:
      - ".github/workflows/research-certificates.yml"
      - "research/r3e21_36_sparse_parity_mitm.py"
      - "research/r3e21_37_audit.py"
      - "research/r3e21_37_bitmap_audit.cpp"
      - "research/r3e21_38_authentic_mod3.py"
      - "research/r3e21_38_two_parity_bitmap.cpp"
      - "research/r3e21_39_independent_bitmap.cpp"
      - "research/r3e21_39_exact_lift_fiber.py"
      - "research/r3e21_39_later_block_caps.py"
      - "research/r3e21_39_original_witness_trace.json"
      - "research/r3e21_40_source_reachable_cylinder.py"
      - "research/r3e21_41_parity_partition.py"
      - "research/r3e21_42_global_lift.py"
      - "research/r3e21_43_source_admitted_intersection.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-certificates.yml"
      - "research/r3e21_36_sparse_parity_mitm.py"
      - "research/r3e21_37_audit.py"
      - "research/r3e21_37_bitmap_audit.cpp"
      - "research/r3e21_38_authentic_mod3.py"
      - "research/r3e21_38_two_parity_bitmap.cpp"
      - "research/r3e21_39_independent_bitmap.cpp"
      - "research/r3e21_39_exact_lift_fiber.py"
      - "research/r3e21_39_later_block_caps.py"
      - "research/r3e21_39_original_witness_trace.json"
      - "research/r3e21_40_source_reachable_cylinder.py"
      - "research/r3e21_41_parity_partition.py"
      - "research/r3e21_42_global_lift.py"
      - "research/r3e21_43_source_admitted_intersection.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-and-bounds:
    name: Exact R36 parity MITM and R37 bounded oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reproduce complete finite R36 certificate (not frontier science)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_36_sparse_parity_mitm.py | tee "$RUNNER_TEMP/r36.txt"
          grep -Fqx 'R36_MITM_PASS cylinders=14958711636 third_block_unsafe_sparse_cylinders=0' "$RUNNER_TEMP/r36.txt"
      - name: R37 exact rational bounds, miniature oracles, base and omission model
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_37_audit.py | tee "$RUNNER_TEMP/r37.txt"
          grep -Fqx 'R37_BOUNDED_AUDIT_PASS' "$RUNNER_TEMP/r37.txt"

  bitmap-24:
    name: Exact R37 2^24 bitmap / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile independently with ${{ matrix.compiler }}
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" -O3 -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/r37_bitmap" research/r3e21_37_bitmap_audit.cpp
      - name: Reproduce all 16,777,216 source bitvector residues (not full source proof)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/r37_bitmap" | tee "$RUNNER_TEMP/r37_bitmap.txt"
          grep -Fqx 'R37_BITMAP_PASS all_residues=16777216 equal_scores=16633847' "$RUNNER_TEMP/r37_bitmap.txt"

  r38-mod3-witness:
    name: R38 authentic mod3 witness and complete two-parity bitmap / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Independent exact original-start witness and base n<=99781
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_38_authentic_mod3.py | tee "$RUNNER_TEMP/r38_witness.txt"
          grep -Fq 'R38_AUTHENTIC_MISMATCH_PASS original_n=2736476243348084729115' "$RUNNER_TEMP/r38_witness.txt"
          grep -Fqx 'R38_BOUNDED_BASE_PASS starts=99781 max_steps=221 max_peak=785412368' "$RUNNER_TEMP/r38_witness.txt"
      - name: Exact all 2^24 residues with incoming even-run parity 0 and 1
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" -O3 -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/r38_parity" research/r3e21_38_two_parity_bitmap.cpp
          "$RUNNER_TEMP/r38_parity" | tee "$RUNNER_TEMP/r38_parity.txt"
          grep -Fqx 'R38_TWO_PARITY_SCAN_COMPLETE residues=16777216 mismatched_scores=399426 source_false_clear_pairs=63015 source_false_keep_pairs=11401' "$RUNNER_TEMP/r38_parity.txt"

  r39-exact-original-fiber:
    name: R39 exact original-start lift fiber and capped later parity classes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact 66-bit source admitted lift fiber and 116-step original trace
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_39_exact_lift_fiber.py | tee "$RUNNER_TEMP/r39_fiber.txt"
          grep -Fqx 'R39_EXACT_FIBER_PASS interval_lifts=8 admitted_lifts=4 false_clear_lifts=1 no_direct_or_predecessor_through90=1' "$RUNNER_TEMP/r39_fiber.txt"
          grep -Fqx 'R39_WITNESS_PASS original_n=2736476243348084729115 lift=37 original_24word=0x9faddc source=791 corrected=612 cutoff=659 first_descent=116' "$RUNNER_TEMP/r39_fiber.txt"
          grep -Fqx 'R39_TRACE_FILE_PASS original_n=2736476243348084729115 chronological_states=117 first_descent=116' "$RUNNER_TEMP/r39_fiber.txt"
      - name: Complete capped j114 j130 m<=3 parity cylinders, explicit remainder
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_39_later_block_caps.py | tee "$RUNNER_TEMP/r39_later.txt"
          grep -Fqx 'R39_LATER_STRATUM_PASS j=114 checked=247020 zero_hits=1 unexamined=362205922639287064 max_m=14 next_class_count=6672876 cap_probes=5000000' "$RUNNER_TEMP/r39_later.txt"
          grep -Fqx 'R39_LATER_STRATUM_PASS j=130 checked=366276 zero_hits=1 unexamined=1080231996567188756950656 max_m=21 next_class_count=11358880 cap_probes=5000000' "$RUNNER_TEMP/r39_later.txt"

  r39-independent-two-parity:
    name: R39 exact T mod3 and index bitmap / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile independent bitmap model with ${{ matrix.compiler }}
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          "$CXX" -O3 -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/r39_bitmap" research/r3e21_39_independent_bitmap.cpp
      - name: Verify exact T, mod3, inverse permutation, 64-lift wrap and 2x2^24 cells
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/r39_bitmap" | tee "$RUNNER_TEMP/r39_bitmap.txt"
          grep -Fqx 'R39_INDEPENDENT_BITMAP_PASS residues=16777216 parity_states=2 mismatched=399426 source_clear_corrected_live=63015 source_live_corrected_clear=11401 padded_lifts=64' "$RUNNER_TEMP/r39_bitmap.txt"

  r40-source-reachable-cylinder:
    name: R40 exact reachable cylinder and direct-root oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: R40 exact 48-bit cylinder all 66-bit roots and 167 literal-T descent certificates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_40_source_reachable_cylinder.py | tee "$RUNNER_TEMP/r40.txt"
          grep -Fqx 'R40_CYLINDER_PASS roots=105742 interval=870591 admitted=456289 bitmap=456203 false_clear=167 inverse=15 max_descent=181 digest=ea27859daa20511ce786caba1c212110663e1d42fbb36f7b7a299028ed96406e' "$RUNNER_TEMP/r40.txt"
          grep -Fqx 'R40_DIRECT_ROOT_ORACLE_PASS tested_roots=262144 surviving_roots=105742' "$RUNNER_TEMP/r40.txt"

  r41-global-prefix-and-local-closure:
    name: R41 exact f43 odd-q source1 automaton and all 54438 original descents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact root partition, four independently clipped 2^16-root bands, every admitted original-T witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_41_parity_partition.py | tee "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_DP_PASS pairs=848 unrestricted=39001983984117856 rational=9398852100800112 predecessor=7645997023219688 exact=6438209236755220' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_PARTITION_PASS no_prefix=55340232221128654848 source1_rejected=18440305864472796396 closed_cylinder=12401 untouched_roots=6438209236742819 total=73786976294838206464' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_CYLINDER_PASS source_roots=12401 interval=102090 admitted=54438 source_clear=49191 false_clear=167 inverse=0 direct_descent=54438 direct_le90=47406 direct_gt90=7032 no_descent_through2000=0 smaller_predecessor_67_90=48582 max_descent=349 digest=ea27859daa20511ce786caba1c212110663e1d42fbb36f7b7a299028ed96406e admitted_digest=7edb1e7df2015e373d4bfc02dd120b7e645e543f2c880f3120194ccfeeecb761' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_BAND_PASS i=0 roots=3116 admitted=13287 direct=13287' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_BAND_PASS i=1 roots=3095 admitted=13712 direct=13712' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_BAND_PASS i=2 roots=3082 admitted=14198 direct=14198' "$RUNNER_TEMP/r41.txt"
          grep -Fqx 'R41_BAND_PASS i=3 roots=3108 admitted=13241 direct=13241' "$RUNNER_TEMP/r41.txt"

  r42-global-canonical-lift:
    name: R42 exact global lift theorem and 500k-root bounded literal-T oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact affine proof gates, terminal flag DP, nine-modulus gates and original-T replays
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_42_global_lift.py | tee "$RUNNER_TEMP/r42.txt"
          grep -Fqx 'R42_GLOBAL_THEOREM_PASS roots=6438209236755220 flag0=5973115806935136 flag2=465093429820084 exact_one_canonical_descent_per_root=6438209236755220 outside_old_cylinder=6438209236742819 combined_with_old_admitted=6438209236797257 new_admitted_lower=24357556657560628 canonical_max_step=69' "$RUNNER_TEMP/r42.txt"
          grep -Fqx 'R42_GATE_RANGE_PASS flag0_minmax=4,5 flag2_minmax=1,3 source_mod9_residue_phases=9 a_windows=2' "$RUNNER_TEMP/r42.txt"
          grep -Fqx 'R42_BOUNDED_ORACLE_PASS root_probes=500000 certified=188 flag0=169 flag2=19 window8=142 window9=46 canonical_source_admitted=91 fixed_eight_source_admitted=792 sha256=9ef6a392ba9670a432fe28c70f5107b2a8156f54d72eecef2cee74f9fc86df8d' "$RUNNER_TEMP/r42.txt"

  r43-exact-source-intersection:
    name: R43 exhaustive source-admitted canonical original-T intersection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check eight complete disjoint low48 cylinders, two enumerations, original T traces and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/r3e21_43_source_admitted_intersection.py | tee "$RUNNER_TEMP/r43.txt"
          test "$(grep -Fc 'R43_CLASS_PASS index=' "$RUNNER_TEMP/r43.txt")" -eq 8
          grep -Fqx 'R43_INTERSECTION_PASS probes=2097152 eligible_roots=81391 ninth=18994 source_gated=358621 canonical_admitted=41937 nonadmitted_canonical=39454 union_R41=96375 sha256=fa2add371b8e778e793adfaa84d57a72b6f7d103a74c2528435640100e8bcc24' "$RUNNER_TEMP/r43.txt"
